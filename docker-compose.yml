# BunMail: Docker Compose
#
# Starts the BunMail API server and a PostgreSQL database.
# Usage: docker compose up -d
#
# The app waits for PostgreSQL to be healthy before starting,
# then automatically runs database migrations on boot.
#
# Set POSTGRES_PASSWORD in your .env file (required).
# Never commit real credentials to version control.

# Log rotation (#284): BunMail writes one line per HTTP request, queue
# attempt and SMTP session. Docker's json-file driver keeps at most 5 files
# of 10 MB per container (~50 MB), dropping the oldest lines.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    logging: *default-logging
    build: .
    ports:
      # HTTP API + Dashboard, on loopback only (#205): put a reverse proxy with
      # TLS in front (docs/self-hosting.md). Docker-published ports bypass
      # UFW, so a 0.0.0.0 binding would expose plain HTTP to the internet.
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
      # Host-specific ports (inbound SMTP on 25, SMTP submission, exposing the
      # app without a proxy) go in your own docker-compose.override.yml, which
      # is not tracked: copy docker-compose.override.example.yml.
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bunmail}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-bunmail}
      BUNMAIL_ENV: production
    depends_on:
      db:
        condition: service_healthy
    # The image runs as non-root `bun` (#167). Let it bind inbound SMTP (25)
    # and submission (587) without root. Scoped to the container's own
    # network namespace; Docker >= 20.10 already defaults to this, pinned
    # here so it's explicit. Kubernetes lists it as a "safe" sysctl.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    restart: unless-stopped

  db:
    logging: *default-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bunmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bunmail}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bunmail}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
