# BunMail's own SPF test cases (#373), in the format of the OpenSPF RFC 7208
# suite (rfc7208-tests.yml next to this file): each document has `tests` and
# the `zonedata` they run against. Every test cites the RFC 7208 section it
# checks. Written by hand for this project; results are for strict mode.
#
# Zone conventions (see test/spf-zone.ts): names are case-insensitive, a name
# or type that is absent answers ENOTFOUND (a void lookup), TIMEOUT answers
# ETIMEOUT (a temperror), CNAMEs are followed.
---
description: Appendix A.1, +all
tests:
  a1-plus-all:
    spec: A.1
    helo: mail.example.net
    host: 192.0.2.200
    mailfrom: foo@example.com
    result: pass
zonedata:
  example.com:
    - TXT: "v=spf1 +all"
---
description: Appendix A.1, a -all
tests:
  a1-a-10:
    spec: A.1, 5.3
    helo: mail.example.net
    host: 192.0.2.10
    mailfrom: foo@example.com
    result: pass
  a1-a-11:
    spec: A.1, 5.3
    helo: mail.example.net
    host: 192.0.2.11
    mailfrom: foo@example.com
    result: pass
  a1-a-65:
    spec: A.1, 5.3
    helo: mail.example.net
    host: 192.0.2.65
    mailfrom: foo@example.com
    result: fail
zonedata:
  example.com:
    - TXT: "v=spf1 a -all"
    - A: 192.0.2.10
    - A: 192.0.2.11
    - MX: [10, mail-a.example.com]
    - MX: [20, mail-b.example.com]
---
description: Appendix A.1, a:example.org -all (example.org has no A record)
tests:
  a1-a-example-org:
    spec: A.1, 5.3
    helo: mail.example.net
    host: 192.0.2.140
    mailfrom: foo@example.com
    result: fail
zonedata:
  example.com:
    - TXT: "v=spf1 a:example.org -all"
  example.org:
    - MX: [10, mail-c.example.org]
  mail-c.example.org:
    - A: 192.0.2.140
