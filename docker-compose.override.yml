# Local-development overrides for docker-compose.yml.
#
# Compose merges this file automatically on a plain `docker compose up`,
# so it applies in production too unless skipped. It publishes Postgres so
# `bun run dev` (running on the host) can reach it at localhost:5432.
#
# Bound to 127.0.0.1 ONLY (#209). A bare "5432:5432" binds 0.0.0.0, and
# Docker-published ports bypass UFW / host firewalls, so the database would
# be reachable from the internet. Loopback keeps it on this machine.
#
# Production doesn't need it: run `docker compose -f docker-compose.yml up`
# to skip this file, so the database stays on the compose network only.

services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
