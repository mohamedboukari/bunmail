# Example host-local overrides for docker-compose.yml (#205).
#
# Copy it to docker-compose.override.yml (git-ignored, one per host) and keep
# only the blocks you need. Compose merges that file automatically on a plain
# `docker compose up`, so every host keeps its own ports and mounts there
# and `git pull` never conflicts with them.
#
# `ports` entries are added to the base file's list. The base publishes the
# app on 127.0.0.1 only; replacing that list needs `!override` (Compose
# 2.24.4 or later), see the last example.
#
# Docker-published ports bypass UFW and host firewalls: publish on 0.0.0.0
# only what must be public, everything else on 127.0.0.1.

services:
  # ── Local development ──
  # Publishes Postgres on loopback so `bun run dev` on the host can reach it
  # at localhost:5432 (#209: never a bare "5432:5432", which binds 0.0.0.0).
  db:
    ports:
      - "127.0.0.1:5432:5432"

  # ── Production examples (uncomment what this host needs) ──
  # app:
  #   ports:
  #     # Inbound SMTP (SMTP_ENABLED=true, SMTP_PORT=25 in .env; docs/inbound.md)
  #     - "${SMTP_PORT:-25}:${SMTP_PORT:-25}"
  #     # SMTP submission over implicit TLS on 465 (SMTP_SUBMISSION_ENABLED=true
  #     # and SMTP_SUBMISSION_TLS_CERT / _KEY in .env; docs/smtp-submission.md)
  #     - "${SMTP_SUBMISSION_PORT:-465}:${SMTP_SUBMISSION_PORT:-465}"
  #     # ...or plaintext submission for apps on this host only
  #     # (SMTP_SUBMISSION_ALLOW_INSECURE=true): loopback, never public
  #     - "127.0.0.1:2587:${SMTP_SUBMISSION_PORT:-587}"
  #   volumes:
  #     # TLS certificate and key for submission, readable by uid 1000 (#167)
  #     - /etc/bunmail/tls:/etc/bunmail/tls:ro
  #   # A local recursive resolver on the docker0 bridge, so DNSBL lookups
  #   # (Spamhaus) do not go through a public resolver that refuses them.
  #   # Set up Unbound first: docs/self-hosting.md, "Local resolver for DNSBL".
  #   dns:
  #     - 172.17.0.1

  # Exposing the dashboard and API directly, without a reverse proxy (not
  # recommended: plain HTTP). Replaces the base list instead of adding to it.
  # app:
  #   ports: !override
  #     - "${PORT:-3000}:${PORT:-3000}"

  # ── Several replicas (#185) ──
  # Shared rate limits, login throttles and one-time reveals for more than
  # one app container behind a load balancer: set
  # REDIS_URL=redis://redis:6379 in .env of every replica. See
  # docs/self-hosting.md, "Running several replicas". Never publish the
  # Redis port; every key expires, so it needs no persistence.
  # app:
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  # redis:
  #   image: redis:7-alpine
  #   command: ["redis-server", "--save", "", "--appendonly", "no"]
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

  # ── Outbound DANE (#345) ──
  # With the `dane` profile (a local validating Unbound at 172.30.53.53, see
  # docker-compose.yml): the app joins that resolver's network. Set in .env:
  # DANE_ENABLED=true, DANE_RESOLVER=172.30.53.53, and COMPOSE_PROFILES=dane
  # so a plain `docker compose up -d` starts the resolver too. See
  # docs/self-hosting.md, "DANE".
  # app:
  #   networks:
  #     - default
  #     - dane
