# BunMail: CI Pipeline
#
# Runs on every push and pull request to main.
# Steps: install → typecheck → lint → test

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token: CI only reads the repo. No write scope is
# needed (SARIF uploads live in security.yml / codeql.yml, which grant
# their own `security-events: write`).
permissions:
  contents: read

# Cancel a superseded run when a new commit lands on the same ref, so a
# quick follow-up push doesn't leave a stale CI run burning a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Backstop against a hung step (e.g. a wedged Postgres wait) running
    # to the 6h default cap.
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://bunmail:bunmail@localhost:5432/bunmail_test
      API_KEY_SEED: ci_test_key_not_real
      MAIL_HOSTNAME: localhost
      # Deterministic test key for the DKIM-at-rest config check (#23).
      # Safe because the CI database has no production secrets.
      DKIM_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # Used by `test/integration/_preload.ts` to lock the app's `db`
      # singleton to the bunmail_test database before any service
      # module loads.
      INTEGRATION_DATABASE_URL: postgresql://bunmail:bunmail@localhost:5432/bunmail_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bunmail
          POSTGRES_PASSWORD: bunmail
          POSTGRES_DB: bunmail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bunmail"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      # Throwaway Redis for the shared-store contract tests (#185): the
      # Redis implementation runs the same tests as the in-memory one.
      # Only the test step below gets its URL (REDIS_TEST_URL); the app
      # never reads it, and REDIS_URL stays unset, so every other test
      # keeps the in-memory default.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI doesn't push; don't leave the token in .git/config.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Audit untrusted lifecycle scripts
        # `bun pm untrusted` lists packages with postinstall scripts that
        # weren't allowlisted via `trustedDependencies`. Failing the build
        # makes a new untrusted dep visible at PR time instead of running
        # silently in every developer's local install.
        run: bun pm untrusted

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Format check
        # lint-staged only formats staged files on machines with hooks
        # installed; a PR authored elsewhere bypasses it (#171).
        run: bun run format:check

      - name: Dead code (knip)
        # Rules are "error" in knip.json, so a new unused export, type or
        # unlisted dependency fails the build (#171).
        run: bun run knip

      - name: XSS scan (dashboard JSX)
        # `@kitajs/html` does NOT auto-escape interpolated children: every
        # render of stored/user data needs the `safe` attribute. xss-scan
        # (@kitajs/ts-html-plugin) fails the build on any unescaped child,
        # so a new XSS sink can't merge silently (#131, #150).
        #
        # The scanner is a TypeScript *language service* plugin and TS 7
        # removed the classic compiler API, so it runs from its own pinned
        # TS 5.9 toolchain bootstrapped under node_modules/.cache (#163).
        # The script fails closed: xss-scan exits 0 even when it crashes,
        # so a run only passes if it printed its success sentinel.
        run: bun run lint:xss

      - name: Mock completeness
        # Bun's `mock.module` leaks across files in one process, so a
        # factory that omits an export of its module breaks whichever file
        # imports that module next, depending on file order (#293). Fails
        # on any `mock.module` in test/ that misses an export.
        run: bun run lint:mocks

      # Unit and e2e stay in separate processes: Bun's `mock.module` leaks
      # across files in a combined run. Each writes its own LCOV.
      - name: Test (unit, with coverage)
        run: bun run test:unit:coverage

      - name: Test (e2e, with coverage)
        run: bun run test:e2e:coverage

      - name: Test (unit and e2e, random order)
        # File order decides which leaked mock a file sees, and it differs
        # between machines. Three fixed seeds make an order-dependent
        # failure reproducible (`bun test test/unit --randomize --seed=N`)
        # instead of an occasional flake (#293).
        run: |
          for seed in 1 42 1337; do
            bun test test/unit --randomize --seed="$seed"
            bun test test/e2e --randomize --seed="$seed"
          done

      - name: Test (shared-store contract against real Redis)
        # Runs the in-memory store's contract against Redis too (#185):
        # atomic limits under a parallel burst, window expiry, one-time
        # entries hashed and encrypted at rest, and the leased MX slots
        # (limit across two clients, lease expiry and renewal, arrival
        # order), and the MX rate budget's token buckets (#391). Skipped
        # without the URL.
        env:
          REDIS_TEST_URL: redis://localhost:6379
        run: bun test test/unit/shared-store.test.ts test/unit/shared-slots.test.ts test/unit/mx-throttle-shared.test.ts test/unit/shared-tokens.test.ts

      - name: Coverage floor (unit + e2e merged)
        # Merges both LCOVs and fails below 64% lines / 73% functions.
        # Not Bun's native coverageThreshold, which is per file; see
        # bunfig.toml (#171).
        run: bun run coverage:check

      - name: Apply migrations to test DB
        # The integration tier runs against a real Postgres
        # (`services.postgres` above provisioned `bunmail_test`).
        # The Bun-native runner (#56) reads `drizzle/<n>_*.sql` and
        # tracks applied tags in `__bunmail_migrations`.
        run: bun run db:migrate

      - name: Test (integration, real Postgres)
        run: bun run test:integration
