# Docker — builds and pushes the BunMail image to GitHub Container Registry.
# Trigger: on every release tag (v*) or manual dispatch.

name: Docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Build-provenance attestation (keyless Sigstore): id-token mints the
  # OIDC token that signs the attestation; attestations writes it to the
  # repo's attestation store (verifiable via `gh attestation verify`).
  id-token: write
  attestations: write

jobs:
  docker:
    name: Build & Push
    runs-on: ubuntu-latest
    # No `concurrency` cancel here on purpose: never abort a tag publish
    # mid-push. Timeout is a hung-runner backstop only.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build doesn't push git commits; GHCR auth is via login-action.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        # Signs SLSA build provenance for the pushed image, keyless via
        # Sigstore (OIDC — no cosign key to store/rotate). Binds the
        # attestation to the immutable image digest, not the tag, so a
        # later retag can't inherit the signature. Consumers verify with
        # `gh attestation verify oci://ghcr.io/<repo>@<digest> --owner <owner>`.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
