# Release: creates a GitHub Release when a version tag is pushed.
# Trigger: push a tag like v0.1.0 (via `bun run release`, which runs `bun pm version`).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    # No `concurrency` cancel here on purpose: never abort a release
    # mid-publish. Timeout is a hung-runner backstop only.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Release notes are generated by softprops via GITHUB_TOKEN (env),
          # not by pushing git, so don't persist the checkout credential.
          persist-credentials: false

      - name: Generate release notes
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
