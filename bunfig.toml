[test]
root = "."
preload = ["./test/setup.ts"]

# Coverage gate (#171): NOT Bun's native `coverageThreshold`.
#
# Bun applies `coverageThreshold` per file (every file must clear it),
# not to the overall total, and silently ignores singular keys
# (`line` / `function`), which is how the old gate here never fired.
# The overall floor is enforced by `bun run coverage:check` instead.
#
# Unit and e2e run in SEPARATE processes, each writing its own LCOV
# (`test:unit:coverage` -> coverage/unit, `test:e2e:coverage` ->
# coverage/e2e). Running them in one process lets Bun's `mock.module`
# mocks leak between files, which breaks tests on Linux CI.
# `coverage:check` merges the two: lines by union (exact), functions by
# per-file max (Bun's LCOV has no per-function records, so this is a
# conservative lower bound).
#
# Merged baseline as of #171: 65.27% lines / 74.67% functions.
# Floor: 64% / 73% (in `coverage:check`). Raise it as coverage grows.
# The text table's "All files" row is a per-file average and reads
# higher; don't compare against it.
#
# The integration tier isn't gated: run it with
# `bun test --preload ./test/integration/_preload.ts --coverage
# test/integration`. See docs/testing.md.
coverageReporter = ["text", "lcov"]
