[test]
root = "."
preload = ["./test/setup.ts"]

# Coverage gate (#171): NOT Bun's native `coverageThreshold`.
#
# Bun applies `coverageThreshold` per file (every file must clear it),
# not to the overall total, and silently ignores singular keys
# (`line` / `function`), which is how the old gate here never fired.
# With a few files still at or near 0%, any meaningful per-file floor
# fails, so the overall floor is enforced by `bun run coverage:check`
# instead: it sums the LCOV totals below and fails under the floor.
#
# Line-weighted unit + e2e baseline as of #171: 70.53% lines /
# 74.67% functions. Floor: 69% / 73% (see `coverage:check` in
# package.json). Raise it as coverage grows. The text table's
# "All files" row is a per-file average and reads higher (~86%).
#
# The integration tier runs separately because Bun's `mock.module` from
# unit/e2e tests shadows real modules in a combined run. Measure it with
# `bun test --preload ./test/integration/_preload.ts --coverage
# test/integration`. See docs/testing.md.
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
